install-and-test: &install-build-test
  - checkout
  - restore_cache:
      key: node-modules-{{ checksum "package-lock.json" }}
  - run: npm install
  - save_cache:
      key: node-modules-{{ checksum "package-lock.json" }}
      paths:
        - node_modules
  - run: npm run build
  - run: npm test

version: 2.1
jobs:
  test-node-24: # Active LTS, EOL 2028-04-30.
    docker:
      - image: cimg/node:24.22
    steps:
      *install-build-test
  test-node-26: # Current, EOL 2029-04-30.
    docker:
      - image: cimg/node:26.12
    steps:
      *install-build-test
  release:
    docker:
      - image: cimg/node:lts
    steps:
      - when:
          condition: true
          steps:
            *install-build-test
      - run: |
          export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
          npm publish --access public

test-filters: &test-filters
  filters:
    tags:
      only: /.*/

workflows:
  version: 2
  build:
    jobs:
      - test-node-24:
          <<: *test-filters
      - test-node-26:
          <<: *test-filters
      - release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /v[0-9]+(\.[0-9]+)*/
          requires:
            - test-node-24
            - test-node-26
